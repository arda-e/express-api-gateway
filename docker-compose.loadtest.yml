version: "3.9"

services:
  express:
    build:
      context: ./
      target: ${TARGET_STAGE:-development}
      args:
        NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - db
      - redis
    networks:
      - express-gateway-network

  db:
    image: postgres:alpine
    networks:
      - express-gateway-network

  redis:
    image: redis:alpine
    networks:
      - express-gateway-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - express-gateway-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.6
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - express-gateway-network

  loadtest:
    build:
      context: ./load-test
    env_file:
      - .env.loadtest
    depends_on:
      - express
      - elasticsearch
    networks:
      - express-gateway-network

networks:
  express-gateway-network:
    driver: bridge

volumes:
  esdata:
    driver: local
