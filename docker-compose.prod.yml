version: "3.9"
services:
  express:
    build:
      context: ./
      target: ${TARGET_STAGE:-production}
      args:
        NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-80}:${PORT:-80}"
    secrets:
      - app_env
    environment:
      - NODE_ENV=production
      - $(cat /run/secrets/app_env | grep SECRET_KEY | cut -d '=' -f1)=\
        $(cat /run/secrets/app_env | grep SECRET_KEY | cut -d '=' -f2)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT:-80}/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure

  worker:
    build:
      context: ./
      target: ${TARGET_STAGE:-production}
      args:
        NODE_ENV: ${NODE_ENV:-development}
    command: npm run start:worker
    secrets:
      - app_env
    environment:
      - NODE_ENV=production
      - $(cat /run/secrets/app_env | grep SECRET_KEY | cut -d '=' -f1)=\
        $(cat /run/secrets/app_env | grep SECRET_KEY | cut -d '=' -f2)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://express:${PORT:-80}/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure
    depends_on:
      - db
      - redis
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.6
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - http.cors.enabled=true
      - "http.cors.allow-origin=*" # adjust this for prod
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: on-failure

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.6
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure
    depends_on:
      - elasticsearch
volumes:
  esdata:
    driver: local

secrets:
  app_env:
    file: .env.prod # docker secret create app_env .env.prod
