version: "3.9"
services:
  express:
    build:
      context: ./
      target: ${TARGET_STAGE:-production}
      args:
        NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-80}:${PORT:-80}"
    env_file:
      - .env.prod

  worker:
    build:
      context: ./
      target: ${TARGET_STAGE:-production}
      args:
        NODE_ENV: ${NODE_ENV:-development}
    command: npm run start:worker
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
  analytics:
    image: sebp/elk
    ports:
      - "5601:5601"
      - "9200:9200"
      - "5044:5044"

